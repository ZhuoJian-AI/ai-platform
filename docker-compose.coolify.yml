name: ${COMPOSE_PROJECT_NAME:-ai-platform}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_infra}
      POSTGRES_USER: ${POSTGRES_USER:-ai_infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 2G }

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 512M }

  mock:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-mock:${APP_IMAGE_TAG:-latest}
    build:
      context: ./mock
      dockerfile: Dockerfile
    environment:
      MES_API_KEY: ${MES_API_KEY:?}
      CRM_API_KEY: ${CRM_API_KEY:?}
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 256M }

  skill-runner:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-skill-runner:${APP_IMAGE_TAG:-latest}
    build:
      context: ./skill_runner
      dockerfile: Dockerfile
      args:
        AI_PLATFORM_NODE20_BASE: 127.0.0.1:5000/zhuojian/ai-platform-node20@sha256:c416cc420efe3342d75724b8010abfa6b9437ce51757a854c271eb5921afd8c0
        AI_PLATFORM_PYTHON_OFFICE_BASE: 127.0.0.1:5000/zhuojian/ai-platform-python312-office@sha256:eb1ac85d2d89febc7158a0bf3f253e4bdc06d0f0d8a1de6fdf7e34ee821c929f
    environment:
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?}
      SKILL_CACHE_ROOT: /cache
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
    expose:
      - "8020"
    volumes:
      - skill_cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 2G }

  dsh-runtime:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-dsh-runtime:${APP_IMAGE_TAG:-latest}
    build:
      context: ./dsh_runtime
      dockerfile: Dockerfile
      args:
        AI_PLATFORM_NODE22_BASE: 127.0.0.1:5000/zhuojian/ai-platform-node22-pnpm@sha256:666764f1a9f418a78bf7880b057cc77a6bd5373d14fabc80455147be2c54507e
    environment:
      DSH_RUNTIME_TOKEN: ${DSH_RUNTIME_TOKEN:?}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8030"
      EXTENSION_CACHE_ROOT: /extensions
    expose:
      - "8030"
    volumes:
      - extension_cache:/extensions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8030/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1G }

  extension-builder:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-extension-builder:${APP_IMAGE_TAG:-latest}
    build:
      context: ./extension_builder
      dockerfile: Dockerfile
      args:
        AI_PLATFORM_NODE22_BASE: 127.0.0.1:5000/zhuojian/ai-platform-node22-pnpm@sha256:666764f1a9f418a78bf7880b057cc77a6bd5373d14fabc80455147be2c54507e
    environment:
      EXTENSION_BUILDER_TOKEN: ${EXTENSION_BUILDER_TOKEN:?}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8040"
    expose:
      - "8040"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8040/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G, pids: 256 }

  backend:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./llm_router/backend
      dockerfile: Dockerfile
      args:
        AI_PLATFORM_PYTHON_OFFICE_BASE: 127.0.0.1:5000/zhuojian/ai-platform-python312-office@sha256:eb1ac85d2d89febc7158a0bf3f253e4bdc06d0f0d8a1de6fdf7e34ee821c929f
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      PROXY_BASE_URL: ${PUBLIC_ORIGIN:?}
      API_KEY_CACHE_TTL: "${API_KEY_CACHE_TTL:-60}"
      DLP_EXPOSE_MATCHES_IN_ERROR: "${DLP_EXPOSE_MATCHES_IN_ERROR:-false}"
      CODE_SKILLS_ENABLED: "${CODE_SKILLS_ENABLED:-true}"
      AGENT_SKILLS_ORG_ALLOWLIST: "${AGENT_SKILLS_ORG_ALLOWLIST:-aifabei}"
      SKILL_RUNNER_URL: http://skill-runner:8020
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?}
      SKILL_RUNNER_TIMEOUT_SECONDS: "${SKILL_RUNNER_TIMEOUT_SECONDS:-120}"
      DSH_RUNTIME_URL: http://dsh-runtime:8030
      DSH_RUNTIME_TOKEN: ${DSH_RUNTIME_TOKEN:?}
      DSH_RUNTIME_TIMEOUT_SECONDS: "${DSH_RUNTIME_TIMEOUT_SECONDS:-600}"
      EXTENSION_BUILDER_URL: http://extension-builder:8040
      EXTENSION_BUILDER_TOKEN: ${EXTENSION_BUILDER_TOKEN:?}
      EXTENSION_BUILDER_TIMEOUT_SECONDS: "${EXTENSION_BUILDER_TIMEOUT_SECONDS:-600}"
      ORIGINAL_PREVIEW_ENABLED: "${ORIGINAL_PREVIEW_ENABLED:-true}"
      ORIGINAL_PREVIEW_ORG_ALLOWLIST: "${ORIGINAL_PREVIEW_ORG_ALLOWLIST:-}"
      MULTIMODAL_VISION_ENABLED: "${MULTIMODAL_VISION_ENABLED:-true}"
      MULTIMODAL_VISION_ORG_ALLOWLIST: "${MULTIMODAL_VISION_ORG_ALLOWLIST:-aifabei}"
      IMAGE_GENERATION_ENABLED: "${IMAGE_GENERATION_ENABLED:-true}"
      IMAGE_GENERATION_ORG_ALLOWLIST: "${IMAGE_GENERATION_ORG_ALLOWLIST:-aifabei}"
      MODEL_GATEWAY_ENABLED: "${MODEL_GATEWAY_ENABLED:-true}"
      MODEL_GATEWAY_ORG_ALLOWLIST: "${MODEL_GATEWAY_ORG_ALLOWLIST:-aifabei}"
      WORKSPACE_OBJECT_STORAGE_ENABLED: "${WORKSPACE_OBJECT_STORAGE_ENABLED:-true}"
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}"
      STORAGE_INTERNAL_ENDPOINT: "${STORAGE_INTERNAL_ENDPOINT:-https://oss-cn-hongkong-internal.aliyuncs.com}"
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      WORKSPACE_HYBRID_UPLOAD_ENABLED: "${WORKSPACE_HYBRID_UPLOAD_ENABLED:-true}"
      WORKSPACE_MAX_FILE_BYTES: "${WORKSPACE_MAX_FILE_BYTES:-104857600}"
      WORKSPACE_PROXY_UPLOAD_MAX_BYTES: "${WORKSPACE_PROXY_UPLOAD_MAX_BYTES:-10485760}"
      WORKSPACE_UPLOAD_SESSION_TTL_SECONDS: "${WORKSPACE_UPLOAD_SESSION_TTL_SECONDS:-900}"
      WORKSPACE_TRASH_RETENTION_DAYS: "${WORKSPACE_TRASH_RETENTION_DAYS:-30}"
    expose:
      - "8000"
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head
        && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock:
        condition: service_healthy
      skill-runner:
        condition: service_healthy
      dsh-runtime:
        condition: service_healthy
      extension-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.25", memory: 2G }

  workspace-parser:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-backend:${APP_IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      WORKSPACE_OBJECT_STORAGE_ENABLED: "${WORKSPACE_OBJECT_STORAGE_ENABLED:-true}"
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}"
      STORAGE_INTERNAL_ENDPOINT: "${STORAGE_INTERNAL_ENDPOINT:-https://oss-cn-hongkong-internal.aliyuncs.com}"
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      WORKSPACE_MAX_FILE_BYTES: "${WORKSPACE_MAX_FILE_BYTES:-104857600}"
      WORKSPACE_TRASH_RETENTION_DAYS: "${WORKSPACE_TRASH_RETENTION_DAYS:-30}"
    command: ["python", "-m", "app.workers.workspace_parser"]
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1536M }

  frontend:
    image: ${COMPOSE_PROJECT_NAME:-ai-platform}-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.coolify
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 256M }

volumes:
  postgres_data:
  redis_data:
  skill_cache:
  extension_cache:
