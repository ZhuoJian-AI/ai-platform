name: ${COMPOSE_PROJECT_NAME:-ai-platform}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: 127.0.0.1:5000/zhuojian/ai-platform-pgvector-pg16@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_infra}
      POSTGRES_USER: ${POSTGRES_USER:-ai_infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1,10.0.10.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      data_plane:
        ipv4_address: 10.0.10.10
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 2G }

  redis:
    image: 127.0.0.1:5000/zhuojian/ai-platform-redis7@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --bind 127.0.0.1 10.0.10.11 --protected-mode yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      data_plane:
        ipv4_address: 10.0.10.11
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 512M }

  mock:
    image: 127.0.0.1:5000/zhuojian/ai-platform-mock-app@sha256:750aeb5a41847d65024c019b043502252b58ec1226f5f6a85c5ad487fa623708
    environment:
      MES_API_KEY: ${MES_API_KEY:?}
      CRM_API_KEY: ${CRM_API_KEY:?}
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 256M }

  skill-runner:
    image: 127.0.0.1:5000/zhuojian/ai-platform-skill-runner-app@sha256:f1f4f3be9270820029cabf4f86f918261e40e2bac4cb103ae4805ff1033b2dba
    environment:
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?}
      # Standard Compose runtimes honor these empty overrides. The image
      # entrypoint also rebuilds PID 1's environment for platforms that inject
      # application variables after Compose merging.
      DATABASE_URL: ""
      REDIS_URL: ""
      POSTGRES_DB: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
      SECRET_KEY: ""
      MASTER_ENCRYPTION_KEY: ""
      CRM_API_KEY: ""
      MES_API_KEY: ""
      DSH_RUNTIME_TOKEN: ""
      EXTENSION_BUILDER_TOKEN: ""
      SKILL_CACHE_ROOT: /cache
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      SKILL_RUNNER_MAX_CONCURRENCY: "${SKILL_RUNNER_MAX_CONCURRENCY:-4}"
      SKILL_RUNNER_MAX_QUEUE: "${SKILL_RUNNER_MAX_QUEUE:-100}"
      SKILL_RUNNER_QUEUE_WAIT_SECONDS: "${SKILL_RUNNER_QUEUE_WAIT_SECONDS:-300}"
      SKILL_RUNNER_OFFICE_CONCURRENCY: "${SKILL_RUNNER_OFFICE_CONCURRENCY:-1}"
      SKILL_PACKAGE_MAX_BYTES: "${SKILL_PACKAGE_MAX_BYTES:-104857600}"
      SKILL_PACKAGE_EXPANDED_MAX_BYTES: "${SKILL_PACKAGE_EXPANDED_MAX_BYTES:-524288000}"
      SKILL_PACKAGE_MAX_FILES: "${SKILL_PACKAGE_MAX_FILES:-1000}"
      SKILL_CACHE_RETENTION_SECONDS: "${SKILL_CACHE_RETENTION_SECONDS:-604800}"
      SKILL_CACHE_MAX_BYTES: "${SKILL_CACHE_MAX_BYTES:-10737418240}"
      SKILL_FAILED_TEMP_RETENTION_SECONDS: "${SKILL_FAILED_TEMP_RETENTION_SECONDS:-3600}"
    expose:
      - "8020"
    volumes:
      - skill_cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 3G, pids: 512 }

  dsh-runtime:
    image: 127.0.0.1:5000/zhuojian/ai-platform-dsh-runtime-app@sha256:80c706d06398c3dac3b63b76894a89a0680caf79778818270f07d730a9098ba4
    environment:
      DSH_RUNTIME_TOKEN: ${DSH_RUNTIME_TOKEN:?}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8030"
      EXTENSION_CACHE_ROOT: /extensions
      DSH_RUNTIME_HARD_CONCURRENCY: "${DSH_RUNTIME_HARD_CONCURRENCY:-14}"
    expose:
      - "8030"
    volumes:
      - extension_cache:/extensions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8030/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1536M }

  extension-builder:
    image: 127.0.0.1:5000/zhuojian/ai-platform-extension-builder-app@sha256:972fe834170b6bcdb47add9caa48e1847793caae2e37c473804b948c9beb0910
    environment:
      EXTENSION_BUILDER_TOKEN: ${EXTENSION_BUILDER_TOKEN:?}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8040"
    expose:
      - "8040"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8040/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G, pids: 256 }

  backend:
    image: 127.0.0.1:5000/zhuojian/ai-platform-backend-app@sha256:8caec3e3243ee4a6a459dd2dcf9fd0fd6dbb5ede6d3ee6a3c1551cd63933d1d9
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      PROXY_BASE_URL: ${PUBLIC_ORIGIN:?}
      API_KEY_CACHE_TTL: "${API_KEY_CACHE_TTL:-60}"
      DLP_EXPOSE_MATCHES_IN_ERROR: "${DLP_EXPOSE_MATCHES_IN_ERROR:-false}"
      CODE_SKILLS_ENABLED: "${CODE_SKILLS_ENABLED:-true}"
      AGENT_SKILLS_ORG_ALLOWLIST: "${AGENT_SKILLS_ORG_ALLOWLIST:-aifabei}"
      SKILL_RUNNER_URL: http://skill-runner:8020
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?}
      SKILL_RUNNER_TIMEOUT_SECONDS: "${SKILL_RUNNER_TIMEOUT_SECONDS:-120}"
      SKILL_RUNNER_QUEUE_WAIT_SECONDS: "${SKILL_RUNNER_QUEUE_WAIT_SECONDS:-300}"
      DSH_RUNTIME_URL: http://dsh-runtime:8030
      DSH_RUNTIME_TOKEN: ${DSH_RUNTIME_TOKEN:?}
      DSH_RUNTIME_TIMEOUT_SECONDS: "${DSH_RUNTIME_TIMEOUT_SECONDS:-600}"
      AGENT_GLOBAL_CONCURRENCY: "${AGENT_GLOBAL_CONCURRENCY:-12}"
      AGENT_USER_CONCURRENCY: "${AGENT_USER_CONCURRENCY:-2}"
      AGENT_QUEUE_MAX: "${AGENT_QUEUE_MAX:-100}"
      AGENT_QUEUE_WAIT_SECONDS: "${AGENT_QUEUE_WAIT_SECONDS:-300}"
      AGENT_LEASE_SECONDS: "${AGENT_LEASE_SECONDS:-60}"
      AGENT_HEARTBEAT_SECONDS: "${AGENT_HEARTBEAT_SECONDS:-15}"
      EXTENSION_BUILDER_URL: http://extension-builder:8040
      EXTENSION_BUILDER_TOKEN: ${EXTENSION_BUILDER_TOKEN:?}
      EXTENSION_BUILDER_TIMEOUT_SECONDS: "${EXTENSION_BUILDER_TIMEOUT_SECONDS:-600}"
      ORIGINAL_PREVIEW_ENABLED: "${ORIGINAL_PREVIEW_ENABLED:-true}"
      ORIGINAL_PREVIEW_ORG_ALLOWLIST: "${ORIGINAL_PREVIEW_ORG_ALLOWLIST:-}"
      MULTIMODAL_VISION_ENABLED: "${MULTIMODAL_VISION_ENABLED:-true}"
      MULTIMODAL_VISION_ORG_ALLOWLIST: "${MULTIMODAL_VISION_ORG_ALLOWLIST:-aifabei}"
      IMAGE_GENERATION_ENABLED: "${IMAGE_GENERATION_ENABLED:-true}"
      IMAGE_GENERATION_ORG_ALLOWLIST: "${IMAGE_GENERATION_ORG_ALLOWLIST:-aifabei}"
      MODEL_GATEWAY_ENABLED: "${MODEL_GATEWAY_ENABLED:-true}"
      MODEL_GATEWAY_ORG_ALLOWLIST: "${MODEL_GATEWAY_ORG_ALLOWLIST:-aifabei}"
      WORKSPACE_OBJECT_STORAGE_ENABLED: "${WORKSPACE_OBJECT_STORAGE_ENABLED:-true}"
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}"
      STORAGE_INTERNAL_ENDPOINT: "${STORAGE_INTERNAL_ENDPOINT:-https://oss-cn-hongkong-internal.aliyuncs.com}"
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      WORKSPACE_HYBRID_UPLOAD_ENABLED: "${WORKSPACE_HYBRID_UPLOAD_ENABLED:-true}"
      WORKSPACE_MAX_FILE_BYTES: "${WORKSPACE_MAX_FILE_BYTES:-104857600}"
      WORKSPACE_PROXY_UPLOAD_MAX_BYTES: "${WORKSPACE_PROXY_UPLOAD_MAX_BYTES:-10485760}"
      WORKSPACE_UPLOAD_SESSION_TTL_SECONDS: "${WORKSPACE_UPLOAD_SESSION_TTL_SECONDS:-900}"
      WORKSPACE_TRASH_RETENTION_DAYS: "${WORKSPACE_TRASH_RETENTION_DAYS:-30}"
    expose:
      - "8000"
    extra_hosts:
      - "postgres:10.0.10.10"
      - "redis:10.0.10.11"
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head
        && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock:
        condition: service_healthy
      skill-runner:
        condition: service_healthy
      dsh-runtime:
        condition: service_healthy
      extension-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      default:
      data_plane:
        ipv4_address: 10.0.10.20
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 2560M }

  workspace-parser:
    image: 127.0.0.1:5000/zhuojian/ai-platform-backend-app@sha256:8caec3e3243ee4a6a459dd2dcf9fd0fd6dbb5ede6d3ee6a3c1551cd63933d1d9
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      WORKSPACE_OBJECT_STORAGE_ENABLED: "${WORKSPACE_OBJECT_STORAGE_ENABLED:-true}"
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}"
      STORAGE_INTERNAL_ENDPOINT: "${STORAGE_INTERNAL_ENDPOINT:-https://oss-cn-hongkong-internal.aliyuncs.com}"
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      WORKSPACE_MAX_FILE_BYTES: "${WORKSPACE_MAX_FILE_BYTES:-104857600}"
      WORKSPACE_TRASH_RETENTION_DAYS: "${WORKSPACE_TRASH_RETENTION_DAYS:-30}"
    command: ["python", "-m", "app.workers.workspace_parser"]
    extra_hosts:
      - "postgres:10.0.10.10"
      - "redis:10.0.10.11"
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      default:
      data_plane:
        ipv4_address: 10.0.10.21
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 1536M }

  storage-lifecycle:
    image: 127.0.0.1:5000/zhuojian/ai-platform-backend-app@sha256:8caec3e3243ee4a6a459dd2dcf9fd0fd6dbb5ede6d3ee6a3c1551cd63933d1d9
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: ${REDIS_URL:?}
      WORKSPACE_OBJECT_STORAGE_ENABLED: "${WORKSPACE_OBJECT_STORAGE_ENABLED:-true}"
      STORAGE_GATEWAY_URL: "${STORAGE_GATEWAY_URL:-https://storage.staging.zhuojianai.com}"
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:?}
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:-https://oss-cn-hongkong.aliyuncs.com}"
      STORAGE_INTERNAL_ENDPOINT: "${STORAGE_INTERNAL_ENDPOINT:-https://oss-cn-hongkong-internal.aliyuncs.com}"
      STORAGE_GATEWAY_TIMEOUT_SECONDS: "${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}"
      STORAGE_LIFECYCLE_INTERVAL_SECONDS: "${STORAGE_LIFECYCLE_INTERVAL_SECONDS:-3600}"
      SKILL_RUNNER_URL: http://skill-runner:8020
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:?}
    command: ["python", "-m", "app.workers.storage_lifecycle"]
    extra_hosts:
      - "postgres:10.0.10.10"
      - "redis:10.0.10.11"
    depends_on:
      backend:
        condition: service_healthy
      skill-runner:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      default:
      data_plane:
        ipv4_address: 10.0.10.22
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 384M, pids: 128 }

  frontend:
    image: 127.0.0.1:5000/zhuojian/ai-platform-frontend-app@sha256:d721919d3f76fecb2d4828bb850e282b8dac0159152cf3f8e11fa5f4bd688d62
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - default
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 256M }

volumes:
  postgres_data:
  redis_data:
  skill_cache:
  extension_cache:

networks:
  # PostgreSQL and Redis are invisible to executable Skills.  Backend and the
  # trusted workers bridge this internal network to the application network.
  data_plane:
    internal: true
    ipam:
      config:
        - subnet: 10.0.10.0/24
