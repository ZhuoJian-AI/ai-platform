  dsh_postgres_data:
  dsh_redis_data:
  dsh_skill_cache:
  dsh_extension_cache:

networks:
  # PostgreSQL and Redis are invisible to executable Skills.  Backend and the
  # trusted workers bridge this internal network to the application network.
  data_plane:
    internal: true
    ipam:
      config:
        - subnet: ${DATA_PLANE_PREFIX:-10.0.11}.0/24
