services:
  backend:
    environment:
      APP_ENV: development
      DEBUG: "true"
      PROXY_BASE_URL: http://localhost:8000
      MULTIMODAL_VISION_ENABLED: "${MULTIMODAL_VISION_ENABLED:-true}"
      MULTIMODAL_VISION_ORG_ALLOWLIST: "${MULTIMODAL_VISION_ORG_ALLOWLIST:-aifabei}"
      IMAGE_GENERATION_ENABLED: "${IMAGE_GENERATION_ENABLED:-true}"
      IMAGE_GENERATION_ORG_ALLOWLIST: "${IMAGE_GENERATION_ORG_ALLOWLIST:-aifabei}"
      MODEL_GATEWAY_ENABLED: "${MODEL_GATEWAY_ENABLED:-true}"
      MODEL_GATEWAY_ORG_ALLOWLIST: "${MODEL_GATEWAY_ORG_ALLOWLIST:-aifabei}"
