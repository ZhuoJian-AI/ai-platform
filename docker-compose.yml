services:
  postgres:
    image: postgres:16-bookworm
    container_name: ai_infra_postgres
    environment:
      POSTGRES_USER: ai_infra
      POSTGRES_PASSWORD: ai_infra
      POSTGRES_DB: ai_infra
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_infra"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_plane

  redis:
    image: redis:7-alpine
    container_name: ai_infra_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data_plane

  tool-executor:
    build: ./tool_executor
    container_name: ai_infra_tool_executor
    environment:
      TOOL_EXECUTOR_TOKEN: ${TOOL_EXECUTOR_TOKEN:-tool-executor-local-dev-token}
      # Defense in depth for Compose platforms that inject project variables
      # into every service. The fixed executor must never inherit credentials.
      DATABASE_URL: ""
      REDIS_URL: ""
      POSTGRES_DB: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
      SECRET_KEY: ""
      MASTER_ENCRYPTION_KEY: ""
      STORAGE_GATEWAY_URL: ""
      STORAGE_PROJECT_TOKEN: ""
      TOOL_EXECUTOR_MAX_CONCURRENCY: ${TOOL_EXECUTOR_MAX_CONCURRENCY:-4}
      TOOL_EXECUTOR_MAX_QUEUE: ${TOOL_EXECUTOR_MAX_QUEUE:-100}
      TOOL_EXECUTOR_QUEUE_WAIT_SECONDS: ${TOOL_EXECUTOR_QUEUE_WAIT_SECONDS:-300}
      TOOL_EXECUTOR_OFFICE_CONCURRENCY: ${TOOL_EXECUTOR_OFFICE_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:8020:8020"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    init: true
    networks:
      - default
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 3G, pids: 512 }

volumes:
  pgdata:
  redisdata:

networks:
  # Only trusted data services and the backend/workers may join this bridge.
  # The ordinary application network remains available to fixed platform tools.
  data_plane:
    internal: true
