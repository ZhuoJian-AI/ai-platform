services:
  postgres:
    # pgvector/pgvector 镜像 = 官方 postgres + vector 扩展预装，用于 RAG 向量检索。
    # pg16 与原 postgres:16-alpine 数据卷兼容。
    image: pgvector/pgvector:pg16
    container_name: ai_infra_postgres
    environment:
      POSTGRES_USER: ai_infra
      POSTGRES_PASSWORD: ai_infra
      POSTGRES_DB: ai_infra
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_infra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_infra_redis
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 业务系统 Mock 网关（MES / CRM / …）——为平台演示提供可调用的数据接口。
  # 启动：docker compose up -d mock；本机访问 http://localhost:8010
  mock:
    build: ./mock
    container_name: ai_infra_mock
    ports:
      - "8010:8010"
    environment:
      MES_API_KEY: ${MES_API_KEY:-mes-mock-demo-key}
      CRM_API_KEY: ${CRM_API_KEY:-crm-mock-demo-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5

  skill-runner:
    build: ./skill_runner
    container_name: ai_infra_skill_runner
    environment:
      SKILL_RUNNER_TOKEN: ${SKILL_RUNNER_TOKEN:-skill-runner-local-dev-token}
      SKILL_CACHE_ROOT: /cache
      STORAGE_GATEWAY_URL: ${STORAGE_GATEWAY_URL:-}
      STORAGE_PROJECT_TOKEN: ${STORAGE_PROJECT_TOKEN:-}
      STORAGE_GATEWAY_TIMEOUT_SECONDS: ${STORAGE_GATEWAY_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - skillcache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dsh-runtime:
    build: ./dsh_runtime
    container_name: ai_infra_dsh_runtime
    environment:
      DSH_RUNTIME_TOKEN: ${DSH_RUNTIME_TOKEN:-dsh-runtime-local-dev-token}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8030"
      EXTENSION_CACHE_ROOT: /extensions
    volumes:
      - extensioncache:/extensions
    expose:
      - "8030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8030/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  extension-builder:
    build: ./extension_builder
    container_name: ai_infra_extension_builder
    environment:
      EXTENSION_BUILDER_TOKEN: ${EXTENSION_BUILDER_TOKEN:-extension-builder-local-dev-token}
      AI_PLATFORM_BACKEND_URL: http://backend:8000
      PORT: "8040"
    ports:
      - "127.0.0.1:8040:8040"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8040/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
          pids: 256

volumes:
  pgdata:
  redisdata:
  skillcache:
  extensioncache:
