# 生产部署覆盖：复用默认端口（5434/6381/8010），backend 127.0.0.1:8000
# 启动：docker compose --env-file .env.deploy -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  mock:
    restart: unless-stopped

  backend:
    build: ./llm_router/backend
    container_name: ai_infra_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+asyncpg://ai_infra:ai_infra@postgres:5432/ai_infra
      REDIS_URL: redis://redis:6379/0
      PROXY_BASE_URL: https://infra.aievolve.org.cn
      API_KEY_CACHE_TTL: "60"
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
